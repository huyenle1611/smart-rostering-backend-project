services:
  postgres:
    image: postgres:17
    container_name: smart-rostering-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostering -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: