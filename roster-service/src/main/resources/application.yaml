spring:
  application:
    name: roster-service

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/roster_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info