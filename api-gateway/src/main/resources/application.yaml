spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id: workforce-service
              uri: http://localhost:8082
              predicates:
                - Path=/employees/**

            - id: roster-service
              uri: http://localhost:8083
              predicates:
                - Path=/rosters/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info